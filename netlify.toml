[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The feed lives at /feed, a file with no extension, so Netlify cannot guess
# its type and would serve it as plain text.
[[headers]]
  for = "/feed"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
