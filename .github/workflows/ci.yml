name: CI

# Runs the test suite when code changes. A change that only touches content
# (posts, pages, images) skips the tests: the site build validates content.
#
# `gate` is the one job to mark as a required check. It passes when the tests
# and smoke tests passed or were skipped, so a content-only pull request goes green in seconds
# instead of waiting on a check that never runs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No usable base commit; treating this as a code change."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | tee changed.txt
          node scripts/ci/classify-changes.ts < changed.txt | tee -a "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Reads the build in dist/: lists, head tags, the feed, redirects, images.
      - run: npm run test:build

  browser:
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Screenshots only compare on the system that took them, so the browser
    # tests always run in this pinned image. Keep the tag the same as the
    # version of @playwright/test in package.json; a unit test checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:browser
      # The screenshots taken in this run, and a report with the differences
      # when a comparison fails. New story screenshots are committed from here.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-results
          path: |
            tests/browser/__screenshots__/linux
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    name: Smoke tests
    needs: changes
    # Netlify only builds deploy previews for pull requests into main, and
    # redirects, headers and 404 handling only exist on Netlify.
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SMOKE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--funny-meringue-5e00b8.netlify.app
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The smoke tests read the redirect rules from the build.
      - run: npm run build
      - name: Wait for the deploy preview to serve this commit
        run: node scripts/ci/wait-for-deploy.ts "$SMOKE_URL" "$HEAD_SHA"
      - run: npm run test:smoke

  gate:
    name: gate
    needs: [changes, test, browser, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          BROWSER: ${{ needs.browser.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          echo "changes: $CHANGES"
          echo "test:    $TEST"
          echo "browser: $BROWSER"
          echo "smoke:   $SMOKE"
          if [ "$CHANGES" != "success" ]; then
            echo "Could not classify the change."
            exit 1
          fi
          if [ "$TEST" != "success" ] && [ "$TEST" != "skipped" ]; then
            echo "Tests did not pass."
            exit 1
          fi
          if [ "$BROWSER" != "success" ] && [ "$BROWSER" != "skipped" ]; then
            echo "Browser tests did not pass."
            exit 1
          fi
          if [ "$SMOKE" != "success" ] && [ "$SMOKE" != "skipped" ]; then
            echo "Smoke tests did not pass."
            exit 1
          fi
